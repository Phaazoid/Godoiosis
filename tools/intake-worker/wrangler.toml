name = "iosis-reports"
main = "src/index.js"
compatibility_date = "2026-08-05"

# The NAME does not change even though the folder did (#53 slice 5). It is what the deployed
# Worker's URL is built from, and that URL is a const in the shipped game -- renaming it here would
# move the endpoint out from under every build already in someone's hands.

# DISCORD_WEBHOOK is a SECRET, not a var -- set it with `wrangler secret put`, never in this file.
# This file is committed; secrets are not.

# The run intake (#53 slice 5), created 2026-09-09. `database_id` is what `wrangler d1 create`
# printed, and it is an IDENTIFIER rather than a credential -- reaching the database still needs an
# authenticated account -- which is why Cloudflare's own docs commit it and this file may too.
#
# `binding` MUST stay "DB": it is the name the Worker reads (`env.DB` in src/index.js). `wrangler
# d1 create` suggests a block binding it as `iosis_telemetry` instead -- pasting that verbatim
# deploys cleanly and then answers every upload with "DB (D1) binding is not set".
[[d1_databases]]
binding = "DB"
database_name = "iosis-telemetry"
database_id = "4d8a45fc-b40e-43c3-9745-9fbc7ff71dae"
