name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot-bin/
          key: godot-4.7.1-stable-linux-x86_64

      - name: Download Godot 4.7.1
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir godot-bin
          mv Godot_v4.7.1-stable_linux.x86_64 godot-bin/godot

      - name: Ensure Godot is executable
        run: chmod +x godot-bin/godot

      - name: Import project
        run: godot-bin/godot --headless --path . --import

      # THE VERDICT IS gdUnit4'S, NOT THE PROCESS'S -- mirrors tests/run_tests.ps1 (#93).
      # Godot can die with SIGSEGV while tearing the engine down, AFTER every test has run and
      # been counted, which reports failure on a clean pass. Today the full-tree run happens not
      # to trigger it, but that masking is incidental -- it depends on how many suites are loaded
      # and changes whenever anyone adds one. Without this, the next suite added could redden CI
      # on a green run. A run that dies BEFORE gdUnit4 reports prints no verdict line, and no
      # verdict is treated as failure, so this cannot swallow a genuine crash.
      - name: Run tests
        run: |
          set +e
          godot-bin/godot --headless --path . \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            -a res://tests \
            --ignoreHeadlessMode 2>&1 | tee gdunit.log
          proc=${PIPESTATUS[0]}
          set -e

          verdict=$(grep -oE 'Exit code: [0-9]+' gdunit.log | tail -1 | grep -oE '[0-9]+' || true)

          if [ -z "$verdict" ]; then
            echo "::error::gdUnit4 never reported a verdict -- the run died before finishing."
            if [ "$proc" -eq 0 ]; then exit 1; fi
            exit "$proc"
          fi

          # ...AND THE VERDICT ONLY MEANS ANYTHING IF TESTS ACTUALLY RAN (#146). A suite that
          # fails to LOAD runs zero tests, and gdUnit4 honestly reports "Exit code: 0" because
          # nothing failed -- nothing ran. Without this, a parse error in a widely-depended-on
          # production class drops every suite that touches it and CI still goes green.
          # Mirrors the same guard in tests/run_tests.ps1 -- keep the two in step.
          cases=$(grep -oE 'Executed test cases[[:space:]]*:[[:space:]]*\([0-9]+/[0-9]+\)' gdunit.log \
                  | tail -1 | grep -oE '\([0-9]+' | grep -oE '[0-9]+' || true)

          if [ -z "$cases" ] || [ "$cases" -eq 0 ]; then
            echo "::error::ZERO test cases executed -- a suite failed to load, or the target matched nothing (#146)."
            if [ "$proc" -eq 0 ]; then exit 1; fi
            exit "$proc"
          fi

          if [ "$proc" -ne "$verdict" ]; then
            echo "::warning::Engine crashed during shutdown after all tests ran and were counted (issue #93). Results are unaffected; reporting gdUnit4's verdict ($verdict), not the process exit ($proc)."
          fi
          exit "$verdict"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: reports/
