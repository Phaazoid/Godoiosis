name: Tests

# A DOCS-ONLY change skips the suite entirely (2026-08-15). Safe because NOTHING in the
# suite reads a tracked .md: every .md mention under tests/ and Classes/ is a comment
# pointing at canon, and the only real read is report.md, which BugReporter GENERATES at
# runtime under user://. Verified before this filter went in -- recheck it before widening
# the list. GitHub matches the filter against the WHOLE PR diff, so a PR touching docs
# AND code still runs; only an all-docs change is skipped. If a docs lint ever lands (a
# canon-marker check, a link checker), it needs its OWN workflow with the inverse filter
# (paths: ['docs/**']) -- this one would skip exactly the change it exists to catch.
#
# ONE .md IS NOT DOCS: CHANGELOG.md (#1075). The game ships it and reads it for the what's-new card,
# and tests/core/test_release_notes.gd lints it, so the premise above is false for that one file and
# a release PR (which touches nothing else) must run. Hence `paths` with negations rather than
# `paths-ignore`, which cannot re-include: LATER patterns win, so the list skips docs/ and every
# .md, then lets CHANGELOG.md back in.

# A SUPERSEDED PR RUN HAS NO VALUE, and sharding multiplied the cost of one push by six.
# Keyed on the ref, so a PR yields its older run to its newer one. main never cancels a
# RUNNING run, but a group holds one running and ONE pending run, and a newer push replaces
# the pending one: in a burst of merges only the newest is tested (#1400). Its verdict covers
# every commit beneath it; what is lost is WHICH merge broke a red tip. To get that back,
# push a middle commit to a temporary branch and dispatch this workflow there.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', '!**.md', 'CHANGELOG.md']
  pull_request:
    branches: [main]
    paths: ['**', '!docs/**', '!**.md', 'CHANGELOG.md']
  # BY HAND, for measuring a runner change without a throwaway commit (2026-09-14), and by the
  # failover watcher (tools/ci-failover/), which dispatches `-f runner=local` when GitHub's own
  # runners stop taking jobs (2026-10-05).
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the shards run: hosted (GitHub's image) or local (the dev's WSL runners)"
        type: choice
        options: [hosted, local]
        default: hosted

# THE SHARDS ARE DEALT, NOT LISTED (2026-10-31). Numbered shards 1..TEST_BUCKETS each run what
# tools/ci-shards/deal.sh deals them: largest suite first, each to the lightest shard so far, by
# the CI times recorded in tools/ci-shards/times.tsv. The hand-cut folder shards this replaced had
# drifted to 384s on one shard against 96s on another two months after their last re-cut. Every
# .gd under tests/ but export's lands in exactly one shard (deal.sh refuses otherwise), so balance
# can change wall clock, never coverage. When the shard times in the step summary spread apart,
# re-run tools/ci-shards/refresh.sh; see tools/ci-shards/README.md.
#
# TEST_BUCKETS MUST EQUAL THE NUMBERED SHARDS IN THE MATRIX. A bucket missing from the matrix is a
# set of suites nobody runs, which is green, so every numbered job checks the two agree first.
env:
  TEST_BUCKETS: 5

jobs:
  test:
    # GITHUB'S IMAGE, UNLESS A DISPATCH ASKS FOR THE LOCAL RUNNERS (2026-10-05). The three runners
    # registered on the dev's machine (Ubuntu in WSL2: the same Linux Godot, sidecar guard and
    # two-pass import) ran every shard from 2026-09-14 to 09-27 through the `RUNNER` repo variable.
    # The repo went public on 09-27 and the variable was deleted.
    #
    # Now only `workflow_dispatch` with `runner: local` reaches them, which tools/ci-failover/
    # watch.ps1 sends when hosted jobs sit queued during a GitHub outage. Push and pull_request runs
    # carry no `inputs`, so they fall through to GitHub's image exactly as before. Only someone with
    # write access can dispatch.
    #
    # THIS LINE IS NOT THE FENCE. A PR from someone else's copy of the repo brings its own copy of
    # this file and can ask for `self-hosted` directly. What keeps a stranger's code off the dev's
    # machine is the runners being OFFLINE except while the watcher has failover work for them, plus
    # the repo's rule that every outside contributor's run waits for approval. `vars.RUNNER` stays in
    # the chain only as the way back if the repo ever goes private again.
    runs-on: ${{ inputs.runner == 'local' && 'self-hosted' || vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      # EVERY SHARD REPORTS. One red shard must not cancel the other four: a failing case
      # already truncates the rest of its own suite FILE (#582), so surrendering four verdicts
      # to the first failure turns one debugging pass into several.
      fail-fast: false
      matrix:
        # 1..TEST_BUCKETS, plus export. Change the count in both places at once.
        shard: [1, 2, 3, 4, 5, export]

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: godot-bin/
          key: godot-4.7.1-stable-linux-x86_64

      - name: Download Godot 4.7.1
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          mkdir godot-bin
          mv Godot_v4.7.1-stable_linux.x86_64 godot-bin/godot

      - name: Ensure Godot is executable
        run: chmod +x godot-bin/godot

      # THE CRASH LIVES IN THE REIMPORT PHASE, SO SKIP THE PHASE (#976). Four of the five import
      # crashes we have logs for died on the FIRST FILE of `Executing pre-reimport operations...`,
      # i.e. the instant Godot's import worker threads start; `.godot/imported` is not committed, so
      # a fresh checkout reimports all 350 assets and every job walks through that window. Restoring
      # the artifacts means `_test_for_reimport` finds each `.md5` matching and the phase never runs
      # at all -- measured on a fresh worktree carrying nothing but this folder: zero `reimport`
      # lines. It is not a speed fix (a warm scan still costs ~9 s of the cold ~14 s); it removes the
      # exposure. Cold runs still happen, and the retry below is what covers them.
      #
      # THIS FOLDER ONLY. `uid_cache.bin` and `global_script_class_cache.cfg` are small and tempting
      # and are exactly what the two-pass comment below, tests/law/test_resource_uid_references.gd
      # and the sidecar guard all turn on -- caching them would put a guard's own input inside a
      # cache. The artifacts are sufficient on their own, so nothing else goes in.
      #
      # `restore-keys` is earned, not assumed: a params-only edit to one `.import` with the old
      # artifact present reimports exactly that one file (measured, 1 step), so an older cache is
      # always safe -- Godot re-derives whatever actually changed. Bump `-v1` to drop stale artifacts
      # if the chain ever grows; a long-lived cache accumulates them the way a dev's `.godot` does.
      - name: Restore imported assets
        id: cache-imported
        uses: actions/cache/restore@v4
        with:
          path: .godot/imported
          key: godot-import-4.7.1-v1-${{ hashFiles('**/*.import', 'project.godot') }}
          restore-keys: godot-import-4.7.1-v1-

      # TWICE, and the second pass is not superstition. ONE pass leaves ResourceUID's registry
      # half-populated: the `.uid` sidecars beside Dialogic's `.dtl` timelines are committed and
      # correct, yet `ResourceUID.has_id` answers FALSE for them until a second import runs. That
      # made tests/law/test_resource_uid_references.gd red on CI and green on every dev machine,
      # where a worktree is imported twice by convention -- an environment difference wearing a
      # content bug's clothes, which cost a full diagnosis on 2026-09-09 before the single `--import`
      # here was the thing that differed. Reproduced both ways: one pass, 4 failures; two, none,
      # with no file changed. Cheap insurance -- the second pass has nothing left to do and exits
      # in seconds.
      # ONE IMPORT AT A TIME ON A SHARED MACHINE (2026-09-14). Three shards importing at once on the
      # self-hosted VM crashed Godot's import three times in a day -- a thread race in the filesystem
      # scan ("caller thread can't call propagate_notification"), which is upstream
      # godotengine/godot#96242: confirmed, open, and not fixed in 4.7.2 either. Each job on GitHub's
      # image had a VM to itself and never hit it. flock serialises this phase across the jobs on one
      # host and is a no-op where hosts are separate.
      #
      # THE LOCK IS NOT THE WHOLE CAUSE AND ONE RETRY IS NOT ENOUGH -- BOTH MEASURED (#976). On run
      # 35106632135 the lock was acquired in 62 ms, so nothing else was importing, and it crashed
      # anyway; the retry then died 8 s later at the identical file, which is what the old comment
      # here ("the crash is transient, and a rerun of the same commit passes") got wrong. A rerun 35
      # minutes later imported clean, so transience is real at the level of a whole JOB rather than
      # one immediate retry -- hence three attempts 30 s apart, on both passes rather than only the
      # first. The wait is a hedge, not a finding: the only mechanism it addresses is
      # autoMemoryReclaim=gradual ballooning the VM back as a job starts.
      #
      # The lock is held PER INVOCATION, so the sleeps happen unlocked and a crashing shard does not
      # stall everyone else's import while it waits. util-linux flock returns 128+signal for a
      # signal-killed child, so the status test below sees 134/139 through it.
      #
      # ONLY A CRASH IS RETRIED. A signal death is the thing being survived; a deliberate non-zero
      # exit is a real failed import, and waiting 60 s to report one three times would lie the other
      # way. And both endings say WHICH thing died: a crash here reports under the SHARD's name
      # though no test has run, which reads as "this PR broke ui-flow" and has already cost one full
      # diagnosis of an innocent diff.
      - name: Import project
        run: |
          import_pass() {
            local label="$1" attempt status
            for attempt in 1 2 3; do
              status=0
              flock /tmp/iosis-import.lock godot-bin/godot --headless --path . --import || status=$?

              if [ "$status" -eq 0 ]; then
                if [ "$attempt" -gt 1 ]; then
                  echo "::warning::Godot's importer crashed on $label and recovered on attempt $attempt of 3. Upstream godotengine/godot#96242, not this diff; no test was affected. Tracked in #976."
                  echo "- import \`$label\`: recovered on attempt **$attempt**" >> "$GITHUB_STEP_SUMMARY"
                fi
                return 0
              fi

              if [ "$status" -lt 128 ]; then
                echo "::error::Godot's importer exited $status on $label. That is a failed import, not a crash, and not #976 -- read the log above."
                return 1
              fi

              echo "Godot's importer died on $label (exit $status = signal $((status - 128))), attempt $attempt of 3."
              if [ "$attempt" -lt 3 ]; then sleep 30; fi
            done

            echo "::error::THE IMPORT CRASHED, NOT THE TESTS. Godot died three times importing the project before any test ran, so this job's name is where it stopped, not what broke. Upstream godotengine/godot#96242; see #976."
            return 1
          }

          import_pass "pass 1"
          import_pass "pass 2"

      # SAVED HERE RATHER THAN AT JOB END, which is where the combined actions/cache action would put
      # it. The runners take six shards in two waves, so a save that waits for this job's tests
      # (3-4 min) lands long after wave 2 has already started cold; saving the moment the import
      # succeeds lets wave 2 of the SAME cold run restore it. Opportunistic, not guaranteed. It also
      # means a job whose import died three times saves nothing, which is right. continue-on-error
      # because all six jobs race for one key on a cold run -- one wins, the rest warn, and that must
      # never fail a job.
      - name: Save imported assets
        if: steps.cache-imported.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .godot/imported
          key: ${{ steps.cache-imported.outputs.cache-primary-key }}

      # THE IMPORT MUST NOT REWRITE COMMITTED PROJECT SETTINGS (#447). It used to: Dialogic
      # mutated the Dictionary ProjectSettings handed it BY REFERENCE, pruning dch_directory
      # and dtl_directory to {} inside the settings themselves, and the next save wrote that
      # out. Fixed at source in addons/dialogic/Core/DialogicResourceUtil.gd, so this never
      # fires -- that
      # is the point. The addon is VENDORED, so an upgrade can drop the patch silently, and
      # this is the canary that says so instead of leaving every fresh clone wiping registries
      # again. It warns rather than failing on purpose: a lost patch has nothing to do with the
      # PR that happens to hit it, and reddening every PR for someone else's cause is worse
      # than an annotation naming the real one. The restore keeps tests/law/
      # test_dialogic_registries.gd reading what was committed either way.
      - name: Guard committed project settings
        run: |
          if ! git diff --quiet project.godot; then
            echo "::warning::The import rewrote project.godot. The #447 patch in addons/dialogic/Core/DialogicResourceUtil.gd may have been lost to an addon upgrade. Restoring the committed file; see the diff below."
            git diff project.godot
            git checkout -- project.godot
          fi

      # AN IMPORT MUST NOT PRODUCE SIDECARS THE COMMIT WAS MISSING (#659 follow-up). Godot mints a
      # .uid beside every script (and a .import beside every asset) the first time it imports one,
      # so a commit that adds a .gd without its sidecar leaves every clone -- the dev's included --
      # going dirty by itself the moment the editor opens. That is the "a dirty tree is a ticket
      # defect at both ends" rule, and nothing was watching for it: the guard above diffs
      # project.godot alone, which is a TRACKED file, while a missing sidecar arrives UNTRACKED and
      # shows up in neither `git diff` nor the test run (the import has already created it by the
      # time gdUnit4 looks, so an on-disk assertion would pass vacuously in exactly the case it
      # exists to catch).
      #
      # SCOPED TO THE SIDECAR SUFFIXES, not to "anything untracked", which is what the first cut
      # said and it reddened instantly: this job downloads the engine to godot-bin/ INSIDE the
      # working tree, so a bare `git ls-files --others` reports the Godot binary on every run. The
      # narrow form is the better rule anyway -- it names the thing being guarded, and cannot be
      # broken again by whatever the workflow drops in the tree next.
      #
      # Fails rather than warns, unlike its neighbour: this one's cause is always the PR in hand.
      - name: Guard against sidecars the commit forgot
        run: |
          missing="$(git ls-files --others --exclude-standard -- '*.uid' '*.import')"
          if [ -n "$missing" ]; then
            echo "::error::The import created sidecars that are not committed. A .gd needs its .uid (and an asset its .import) committed beside it, or every fresh checkout goes dirty on first open. Add these and push:"
            echo "$missing"
            exit 1
          fi

      # THE VERDICT IS gdUnit4'S, NOT THE PROCESS'S -- mirrors tests/run_tests.ps1 (#93).
      # Godot can die with SIGSEGV while tearing the engine down, AFTER every test has run and
      # been counted, which reports failure on a clean pass. Today the full-tree run happens not
      # to trigger it, but that masking is incidental -- it depends on how many suites are loaded
      # and changes whenever anyone adds one. Without this, the next suite added could redden CI
      # on a green run. A run that dies BEFORE gdUnit4 reports prints no verdict line, and no
      # verdict is treated as failure, so this cannot swallow a genuine crash.
      - name: Run tests
        run: |
          set +e

          targets=""
          # WHICH SUITES THIS SHARD OWNS. Every numbered job deals the whole hand itself and keeps
          # its own bucket; the deal is deterministic, so the jobs agree without talking. Each file
          # is named with its own -a, never a folder: `-a res://tests` would load all ~580 scripts
          # before the first test (34s, measured), however few of them the shard then runs. A new
          # suite, a renamed one or a new area folder lands in some shard on the next push with no
          # edit here.
          case "${{ matrix.shard }}" in
            [1-9]*)
              if [ "${{ strategy.job-total }}" -ne $((TEST_BUCKETS + 1)) ] || [ "${{ matrix.shard }}" -gt "$TEST_BUCKETS" ]; then
                echo "::error::The matrix and TEST_BUCKETS ($TEST_BUCKETS) disagree, so a bucket would run twice or not at all. The numbered shards must be exactly 1..TEST_BUCKETS, plus export."
                exit 1
              fi
              bash tools/ci-shards/deal.sh --summary "$TEST_BUCKETS" --skip tests/export
              dealt=$(bash tools/ci-shards/deal.sh "${{ matrix.shard }}" "$TEST_BUCKETS" --skip tests/export) || exit 1
              for s in $dealt; do targets="$targets -a $s"; done ;;
            # The one shard that proves the ARTIFACT rather than the source (#868). It exports a
            # pack and runs it, so it is the only shard whose verdict can differ from a source run --
            # which is the entire point, and why it is worth ~40s of its own rather than dealt into
            # a numbered shard. Needs no export templates: --export-pack writes resources, never an
            # executable.
            export)    targets="-a res://tests/export" ;;
            *)         echo "::error::Unknown shard '${{ matrix.shard }}'"; exit 1 ;;
          esac

          # $targets is deliberately UNQUOTED -- it must word-split into separate CLI flags.
          started=$SECONDS
          godot-bin/godot --headless --path . \
            -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd \
            $targets \
            --ignoreHeadlessMode 2>&1 | tee gdunit.log
          proc=${PIPESTATUS[0]}
          elapsed=$((SECONDS - started))
          set -e

          verdict=$(grep -oE 'Exit code: [0-9]+' gdunit.log | tail -1 | grep -oE '[0-9]+' || true)

          if [ -z "$verdict" ]; then
            echo "::error::gdUnit4 never reported a verdict -- the run died before finishing."
            if [ "$proc" -eq 0 ]; then exit 1; fi
            exit "$proc"
          fi

          # ...AND THE VERDICT ONLY MEANS ANYTHING IF TESTS ACTUALLY RAN (#146). A suite that
          # fails to LOAD runs zero tests, and gdUnit4 honestly reports "Exit code: 0" because
          # nothing failed -- nothing ran. Without this, a parse error in a widely-depended-on
          # production class drops every suite that touches it and CI still goes green.
          # Mirrors the same guard in tests/run_tests.ps1 -- keep the two in step.
          cases=$(grep -oE 'Executed test cases[[:space:]]*:[[:space:]]*\([0-9]+/[0-9]+\)' gdunit.log \
                  | tail -1 | grep -oE '\([0-9]+' | grep -oE '[0-9]+' || true)

          if [ -z "$cases" ] || [ "$cases" -eq 0 ]; then
            echo "::error::ZERO test cases executed -- a suite failed to load, or the target matched nothing (#146)."
            if [ "$proc" -eq 0 ]; then exit 1; fi
            exit "$proc"
          fi

          # THE SHARD COUNTS MUST SUM TO THE UNSHARDED TOTAL. A shard that quietly stops
          # covering something is GREEN -- lost coverage cannot fail a test, so these counts are
          # the last thing that can catch it, after deal.sh's own refusal. The suites must sum to
          # the number of test_*.gd files. Published here so the six lines are addable from the PR
          # page without opening six logs; the seconds show whether the deal still balances.
          suites=$(grep -oE 'Executed test suites[[:space:]]*:[[:space:]]*\([0-9]+/[0-9]+\)' gdunit.log \
                   | tail -1 | grep -oE '\([0-9]+' | grep -oE '[0-9]+' || true)
          echo "- \`${{ matrix.shard }}\`: **$cases** cases, ${suites:-?} suites, ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

          if [ "$proc" -ne "$verdict" ]; then
            echo "::warning::Engine crashed during shutdown after all tests ran and were counted (issue #93). Results are unaffected; reporting gdUnit4's verdict ($verdict), not the process exit ($proc)."
          fi
          exit "$verdict"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}-${{ matrix.shard }}
          path: reports/
          # SEVEN DAYS, NOT THE 90-DAY DEFAULT (2026-09-14). Six shards a run, ~25 runs a day, so the
          # default kept ~14,000 reports at steady state -- past the plan's storage quota, the one
          # Actions cost the self-hosted runners cannot move. Nobody has opened a two-week-old report.
          retention-days: 7
